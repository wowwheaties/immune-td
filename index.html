<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Immune System Tower Defense</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#1a0e12; font-family:sans-serif; height:100%; overscroll-behavior:none; }
  canvas { display:block; width:100vw; min-height:100dvh; height:100dvh; height:100vh; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  :root { --bar-h: 120px; }
  .game-btn {
    min-width:48px; min-height:48px; font-size:16px; padding:12px 14px;
    border:none; border-radius:10px; cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    background:#e8e8e8; color:#111; font-weight:600;
  }
  .game-btn:disabled { opacity:0.45; }
  .game-btn.active { background:#4fc3f7; color:#042; outline:2px solid #fff; }
  .game-btn-primary { background:#66bb6a; color:#042; width:100%; }
  .game-btn .t-price { margin-left:6px; }
  /* Unit icon catalog — SEQ-322 */
  .unit-icon { width:44px; height:44px; display:block; margin:0 auto; pointer-events:none; }
  .unit-cost { display:block; font-size:11px; line-height:1.1; text-align:center; }
  /* Global row container — prevents Mute orphan-wrap */
  .tower-row { display:flex; flex-wrap:nowrap; gap:6px; align-items:stretch; }
  .tower-row .game-btn { padding:8px 10px; }
  /* L2c visibility pause banner */
  #resume-banner {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:40; display:none;
    padding:16px 28px; background:rgba(0,0,0,0.75); color:#fff;
    font-size:18px; font-weight:600; border-radius:12px;
    pointer-events:auto; cursor:pointer; white-space:nowrap;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  #bottom-bar {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; flex-direction:column; gap:8px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
    background:rgba(0,0,0,0.65);
  }
  #mission-select { display:flex; flex-direction:row; gap:8px; width:100%; flex-wrap:wrap; }
  #mission-select .game-btn { flex:1 1 0; min-width:0; }
  #btn-sell { min-height:48px; display:none; }
  #btn-mute { min-height:48px; display:block; }
  #overlay {
    position:absolute; top:8px; left:8px;
    padding:6px 10px; background:rgba(0,0,0,0.55);
    color:#fff; font-size:13px; line-height:1.4;
    pointer-events:none; white-space:pre-wrap; max-width:420px;
  }
  #place-toast {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom: calc(var(--bar-h,120px) + 16px + env(safe-area-inset-bottom,0px));
    z-index:30; padding:10px 14px; border-radius:8px;
    background:rgba(0,0,0,0.82); color:#fff; font:15px monospace;
    display:none; pointer-events:none; max-width:90vw; text-align:center;
  }

  #unlock-hint {
    position:absolute; left:50%; transform:translateX(-50%);
    top: max(48px, env(safe-area-inset-top));
    z-index:31; padding:10px 14px; border-radius:8px;
    background:rgba(0,0,0,0.82); color:#ffd; font:15px monospace;
    display:none; pointer-events:none; max-width:90vw; text-align:center;
  }

  #m1-tutor {
    position:absolute; left:50%; transform:translateX(-50%);
    top: max(72px, env(safe-area-inset-top));
    z-index:31; padding:10px 14px; border-radius:8px;
    background:rgba(0,0,0,0.82); color:#9f9; font:15px monospace;
    display:none; pointer-events:none; max-width:90vw; text-align:center;
  }

  #wave-toast {
    position:absolute; left:50%; transform:translateX(-50%);
    top: max(12px, env(safe-area-inset-top));
    z-index:32; padding:10px 14px; border-radius:8px;
    background:rgba(20,40,80,0.9); color:#9cf; font:15px monospace;
    display:none; pointer-events:none; max-width:90vw; text-align:center;
  }

  /* Phone compact tower catalog — narrow viewport only */
  @media (max-width:500px) {
    #bottom-bar { gap:6px; padding-bottom:4px; }
    #mission-select { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; max-height:none; }
    #mission-select .game-btn { min-width:72px; flex:0 0 auto; font-size:13px; padding:8px 6px; }
    /* Start Wave stays full-width */
    #btn-start-wave { width:100%; }
    /* Tower catalog row — compact horizontal scroll */
    .tower-row {
      display:flex; flex-direction:row; gap:6px;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      max-height:none; padding-bottom:4px;
    }
    .tower-row .game-btn {
      min-width:56px; flex:0 0 auto;
      font-size:13px; padding:8px 6px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      line-height:1.25;
    }
    /* Mute joins the row — compact */
    #btn-mute {
      min-width:64px; flex:0 0 auto;
      padding:8px 6px; font-size:13px;
    }
    /* Sell stays hidden when no tower selected (unchanged) */
    #btn-sell { display:none; }
    /* Total bottom height ≤240px on phone */
    #bottom-bar {
      max-height:240px;
    }
  }
  /* Desktop: width-capped centered panel (not full-width strips) */
  @media (min-width:501px) {
    #bottom-bar {
      left:0; right:0; bottom:8px;
      max-width:840px; margin-left:auto; margin-right:auto;
      border-radius:16px 16px 0 0; padding-bottom:8px;
    }
    #mission-select { width:auto; justify-content:center; }
    #mission-select .game-btn { flex:0 1 auto; min-width:auto; }
    .tower-row { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; align-items:stretch; max-width:840px; margin-left:auto; margin-right:auto; padding-bottom:8px; }
  }

  /* Landscape phone — side panel, tall board */
  @media (max-height: 460px) {
    #bottom-bar { position:fixed; right:0; top:0; bottom:0; left:auto; width:200px; max-width:200px; margin:0; overflow-y:auto; overflow-x:hidden; padding:4px 6px; box-sizing:border-box; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
    .tower-row { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:3px; width:100%; margin-bottom:2px; }
    .tower-row .game-btn { min-height:44px; font-size:13px; padding:3px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.25; }
    #btn-sell { min-height:44px; }
    .tower-row .unit-icon { width:26px; height:26px; }
    #mission-select { display:grid; grid-template-columns:1fr 1fr; gap:3px; width:100%; margin-bottom:2px; }
    #mission-select .game-btn { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:3px 5px; min-height:48px; }
    .tower-row .game-btn .unit-cost { font-size:9px; }
    #btn-start-wave { width:100%; margin-bottom:2px; height:48px; min-height:48px; line-height:normal; font-size:13px; }
    #tower-info { font-size:10px; padding:4px 8px; display:block; min-height:34px; margin-bottom:2px; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
    /* HUD docks top-left so it never sits under the side panel */
    #hud { left:8px !important; right:auto !important; text-align:left !important; max-width:60vw; }
    #hud-ver { left:8px !important; right:auto !important; text-align:left !important; }
    /* Hide wave-preview Packs line in landscape — was overlapping the board */
    /* --bar-h means "bottom bar"; in landscape the bar is a full-height rail, so every
       bottom:calc(var(--bar-h)+N) consumer lands off the top. Re-anchor to the viewport. */
    #place-toast { bottom: 8px !important; }
    #outcome-screen { bottom: 8px !important; }
    #hud-packs { display:none; }
  }

  #tower-info { min-height:34px; font-size:12.5px; line-height:1.35; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,0.45); color:#e8f4ff; max-width:840px; margin:auto; text-align:center; display:none; }
  #tower-info b { font-weight:700; }
  @media (max-width:500px) { #tower-info { font-size:11.5px; padding:5px 8px; } }

  /* Rotate hint — portrait phone */
  #rotate-hint {
    display:none;
  }
  @media (orientation:portrait) and (max-width:500px) {
    #rotate-hint { display:block; position:fixed; top:calc(env(safe-area-inset-top, 0px) + 8px); left:50%; transform:translateX(-50%); background:rgba(10,20,30,0.85); color:#cfe; padding:6px 14px; border-radius:14px; font-size:12px; z-index:40; pointer-events:none; }
  }

</style>


</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<div id="place-toast" role="status"></div>
<div id="unlock-hint" role="status"></div>
<div id="m1-tutor" role="status"></div>
<div id="wave-toast" role="status"></div>
<div id="hud" style="position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:10;color:#fff;font:16px/1.35 monospace;text-align:right;padding:8px 10px;background:rgba(0,0,0,0.55);border-radius:8px;">
  <div>ATP: <span id="hud-gold">0</span></div>
  <div>Organ: <span id="hud-lives">0</span></div>
  <div>Wave: <span id="hud-wave">0</span></div>
  <div id="hud-packs" style="font-size:13px;opacity:0.9;">Packs: —</div>
  <div id="hud-ver">v89</div>
  <button id="btn-fullscreen" type="button" title="Toggle fullscreen"
    style="display:none;margin-top:6px;width:100%;min-height:34px;font:14px monospace;
           cursor:pointer;border-radius:6px;border:1px solid #666;background:#222;color:#fff;">
    &#9974; Fullscreen
  </button>
</div>
<div id="outcome-screen" style="display:none;position:absolute;left:max(8px,env(safe-area-inset-left));right:auto;max-width:min(280px,46vw);bottom:calc(var(--bar-h,120px) + 8px + env(safe-area-inset-bottom,0px));z-index:25;padding:12px 14px;background:rgba(0,0,0,0.8);color:#fff;font:17px monospace;border-radius:10px;text-align:center;">
  <span id="outcome-text"></span>
  <div style="margin-top:10px;"><button id="btn-restart" type="button" class="game-btn">Restart</button></div>
</div>
<div id="resume-banner">Paused — tap to resume</div>
<div id="bottom-bar">
  <div id="mission-select">
    <button type="button" data-mission="0" class="game-btn">M0 Training</button>
    <button type="button" data-mission="1" class="game-btn">M1 Infection</button>
    <button type="button" data-mission="2" class="game-btn">M2 Outbreak</button>
    <button type="button" data-mission="3" class="game-btn">M3 Systemic</button>
  </div>
  <button id="btn-start-wave" type="button" class="game-btn game-btn-primary">Start Wave</button>
  <div id="tower-info" role="status" aria-live="polite"></div>
  <div class="tower-row">
    <button id="btn-type-basic" type="button" class="game-btn"><img src="assets/units/icon_basic.png" class="unit-icon" alt="Neutrophil"><span class="unit-cost">$50</span></button>
    <button id="btn-type-slow" type="button" class="game-btn"><img src="assets/units/icon_slow.png" class="unit-icon" alt="Macrophage"><span class="unit-cost">$75</span></button>
    <button id="btn-type-antibody" type="button" class="game-btn"><img src="assets/units/icon_antibody.png" class="unit-icon" alt="Antibody"><span class="unit-cost">$100</span></button>
    <button id="btn-type-tcell" type="button" class="game-btn"><img src="assets/units/icon_tcell.png" class="unit-icon" alt="T-Cell"><span class="unit-cost">$125</span></button>
    <button id="btn-type-fever" type="button" class="game-btn"><img src="assets/units/icon_fever.png" class="unit-icon" alt="Fever"><span class="unit-cost">$150</span></button>
    <button id="btn-type-nk" type="button" class="game-btn"><img src="assets/units/icon_nk.png" class="unit-icon" alt="NK"><span class="unit-cost">$130</span></button>
    <button id="btn-type-cytokine" type="button" class="game-btn"><img src="assets/units/icon_cytokine.png" class="unit-icon" alt="Cytokine"><span class="unit-cost">$140</span></button>
    <button id="btn-mute" type="button" class="game-btn"><span class="t-name">Mute</span></button>
  </div>
  <button id="btn-sell" type="button" class="game-btn">Sell</button>
  <div id="rotate-hint">Rotate your phone — bigger board in landscape</div>
</div>
<script src="three.min.js?v=89"></script>
<script src="js/path.js?v=89"></script>
<script src="js/grid.js?v=89"></script>
<script src="js/lives.js?v=89"></script>
<script src="js/enemies.js?v=89"></script>
<script src="js/economy.js?v=89"></script>
<script src="js/towers.js?v=89"></script>
<script src="js/waves.js?v=89"></script>
<script src="js/missions.js?v=89"></script>
<script src="js/game.js?v=89"></script>
<script src="js/presentation.js?v=89"></script><script src="js/ambient.js?v=89"></script>
<script src="js/sfx.js?v=89"></script>
<script>
(function() {
  var canvas = document.getElementById('c');
  var overlay = document.getElementById('overlay');

  // confirm-tap state (L2b — SEQ-118)
  var __pendingPlace = null; // {x,y} or null — touch/pen only
  var __lastPtrType = 'mouse';

  // tower selection (SELL)
  var __selectedTowerId = null;
  function setSelectedTower(id) {
    __selectedTowerId = id;
    if (id != null && window.Towers && window.Presentation) {
      var tw = Towers.get(id);
      if (tw) Presentation.setSelectedRangeCell(tw.x, tw.y);
      else Presentation.setSelectedRangeCell(null, null);
      showTowerInfo(tw.type || 'basic', tw);
    } else if (window.Presentation) {
      Presentation.setSelectedRangeCell(null, null);
    }
    var b = document.getElementById('btn-sell');
    if (b) b.style.display = id ? 'block' : 'none';
    if (id == null && !__catalogTypePending) clearTowerInfo();
  }

  // TOWER_INFO — tower description panel (SEQ-296)
  var __catalogTypePending = null;
  var TOWER_INFO = {
    basic:   ['Neutrophil', '$50 · 5 dmg · range 2 · cd 20', 'First responder. Cheapest cell in the kit — steady damage anywhere along the tract. Line the early stretch with these.'],
    slow:    ['Macrophage', '$75 · 5 dmg + slow 45 · range 1', 'Engulfs and slows. Same damage as a Neutrophil, but every hit drags the pathogen down for 45 ticks — buys your other cells extra shots.'],
    antibody:['Antibody', '$100 · 5 dmg + slow 50 · range 3', 'Neutralizing tag. The strongest brake available — a 50-tick slow. Best on corners where pathogens bunch up.'],
    tcell:   ['T-Cell', '$125 · 10 dmg · range 1', 'Cytotoxic killer. Double damage per hit — one-shots a basic pathogen. Your answer when packs get thick.'],
    fever:   ['Fever Node', '$150 · 5 dmg + 1 splash · range 2 (burn 3)', 'Area response. Hits its target hard, then burns EVERY pathogen in range for 1. Shines where the tract folds back on itself.'],
    nk:      ['NK Cell', '$130 · 5 dmg (8 vs fast) · range 3', 'Natural killer. Reads fast-moving pathogens and hits them for 8 instead of 5 — the dedicated counter to speed waves.'],
    cytokine:['Cytokine Hub', '$140 · 5 dmg + team buff · range 2 (aura 3)', 'Signal booster. Every friendly cell within 3 tiles fires sooner (cooldown -2 per shot). Park it in the middle of a cluster.']
  };

  function showTowerInfo(typeKey, tower) {
    var info = TOWER_INFO[typeKey];
    if (!info) return;
    var el = document.getElementById('tower-info');
    var html = '<b>' + info[0] + '</b> — ' + info[1] + '<br>' + info[2];
    // E3: terrain line for placed towers
    if (tower && Grid) {
      var sp = Grid.specialAt(tower.x, tower.y);
      if (sp === 'patch') html += '<br>On Peyer\'s patch — fires 25% faster';
      else if (sp === 'inflamed') html += '<br>On inflamed tissue — fires 50% slower';
    }
    el.innerHTML = html;
    el.style.display = 'block';
  }

  function clearTowerInfo() {
    if (__catalogTypePending) return;
    var el = document.getElementById('tower-info');
    el.innerHTML = '';
    el.style.display = 'none';
  }

  // gold flash pulse (SEQ-148)
  var __goldFlashT0 = null;
  function pulseGoldFlash() {
    __goldFlashT0 = performance.now();
    var hg = document.getElementById('hud-gold');
    if (hg) hg.style.color = '#ff0';
  }
  function tickGoldFlash() {
    if (__goldFlashT0 == null) return;
    var hg = document.getElementById('hud-gold');
    if (!hg) return;
    if (performance.now() - __goldFlashT0 >= 300) {
      hg.style.color = '#fff';
      __goldFlashT0 = null;
    }
  }
  // wave flash pulse (SEQ-175)
  var __waveFlashT0 = null;
  function pulseWaveFlash() {
    __waveFlashT0 = performance.now();
    var hw = document.getElementById('hud-wave');
    if (hw) hw.style.color = '#ff0';
  }
  function tickWaveFlash() {
    if (__waveFlashT0 == null) return;
    var hw = document.getElementById('hud-wave');
    if (!hw) return;
    if (performance.now() - __waveFlashT0 >= 300) {
      hw.style.color = '#fff';
      __waveFlashT0 = null;
    }
  }
  window.HudPulse = {
    goldFlashActive: function() {
      return __goldFlashT0 != null && (performance.now() - __goldFlashT0) < 300;
    },
    waveFlashActive: function() {
      return __waveFlashT0 != null && (performance.now() - __waveFlashT0) < 300;
    }
  };

  // place feedback toast helpers (SEQ-146)
  var __toastTimer = null;
  function showPlaceToast(msg) {
    var el = document.getElementById('place-toast');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    if (__toastTimer) clearTimeout(__toastTimer);
    __toastTimer = setTimeout(function() {
      el.style.display = 'none';
      el.textContent = '';
      __toastTimer = null;
    }, 2000);
  }
  function hidePlaceToast() {
    var el = document.getElementById('place-toast');
    if (!el) return;
    el.style.display = 'none';
    el.textContent = '';
    if (__toastTimer) { clearTimeout(__toastTimer); __toastTimer = null; }
  }

  var __unlockHintTimer = null;
  function hideUnlockHint() {
    var el = document.getElementById('unlock-hint');
    if (!el) return;
    el.style.display = 'none';
    if (__unlockHintTimer) { clearTimeout(__unlockHintTimer); __unlockHintTimer = null; }
  }
  function showUnlockHint() {
    var el = document.getElementById('unlock-hint');
    if (!el) return;
    el.textContent = 'Tap to enable sound';
    el.style.display = 'block';
    el.style.pointerEvents = 'none';
    if (__unlockHintTimer) clearTimeout(__unlockHintTimer);
    __unlockHintTimer = setTimeout(function(){ hideUnlockHint(); }, 3000);
  }

  // M1 tutor — one-shot per load (SEQ-175/177)
  var __m1TutorShown = false;
  function showM1Tutor() {
    if (__m1TutorShown) return;
    if (typeof Missions !== 'undefined' && Missions.current() !== 1) return;
    __m1TutorShown = true;
    var el = document.getElementById('m1-tutor');
    if (!el) return;
    el.textContent = 'Siege — 3 lives. Place carefully.';
    el.style.display = 'block';
    el.style.pointerEvents = 'none';
    if (window.__m1TutorTimer) clearTimeout(window.__m1TutorTimer);
    window.__m1TutorTimer = setTimeout(function(){ hideM1Tutor(); }, 3000);
  }
  function hideM1Tutor() {
    var el = document.getElementById('m1-tutor');
    if (!el) return;
    el.style.display = 'none';
    if (window.__m1TutorTimer) { clearTimeout(window.__m1TutorTimer); window.__m1TutorTimer = null; }
  }

  // M2/M3 tutor — one-shot per mission index per page load (SEQ-185)
  var __tutorShown = {1:false,2:false,3:false};
  var TUTOR_COPY = {
    1: 'Siege — 3 lives. Place carefully.',
    2: 'Gauntlet — waves come fast. 7 lives.',
    3: 'Systemic — hold the core.'
  };
  function showMissionTutor(i) {
    if (!TUTOR_COPY[i] || __tutorShown[i]) return;
    if (typeof Missions !== 'undefined' && Missions.current() !== i) return;
    __tutorShown[i] = true;
    var el = document.getElementById('m1-tutor');
    if (!el) return;
    el.textContent = TUTOR_COPY[i];
    el.style.display = 'block';
    el.style.pointerEvents = 'none';
    if (window.__m1TutorTimer) clearTimeout(window.__m1TutorTimer);
    window.__m1TutorTimer = setTimeout(function(){ hideM1Tutor(); }, 3000);
  }
  function showM2Tutor() { showMissionTutor(2); } // keep M2TUTOR API
  function showM3Tutor() { showMissionTutor(3); } // keep M3TUTOR API

  function resetTutorShots() {
    __tutorShown = {1:false,2:false,3:false};
    __m1TutorShown = false;
    hideM1Tutor();
  }
  window.Tutor = { resetShots: resetTutorShots };

  var __waveToastTimer = null;
  var __lastWaveShown = 0;
  function hideWaveToast() {
    var el = document.getElementById('wave-toast');
    if (!el) return;
    el.style.display = 'none';
    if (__waveToastTimer) { clearTimeout(__waveToastTimer); __waveToastTimer = null; }
  }
  function showWaveToast(msg) {
    var el = document.getElementById('wave-toast');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    el.style.pointerEvents = 'none';
    pulseWaveFlash();
    if (__waveToastTimer) clearTimeout(__waveToastTimer);
    __waveToastTimer = setTimeout(function(){ hideWaveToast(); }, 1500);
  }
  function waveIndexNow() {
    var sch = Waves.getSchedule(), t = Waves.tickCount(), k = 0;
    for (var i = 0; i < sch.length; i++) if (sch[i][0] < t) k++;
    return k;
  }
  function maybeAnnounceWave() {
    var sch = Waves.getSchedule();
    var n = sch.length || 1;
    var k = waveIndexNow();
    if (k > __lastWaveShown) {
      __lastWaveShown = k;
      showWaveToast('Wave ' + k + '/' + n);
    }
  }

  function updatePackPreview() {
    var el = document.getElementById('hud-packs');
    if (!el) return;
    if (Game.state() === 'running') { el.style.display = 'none'; return; }
    el.style.display = '';
    var sch = Waves.getSchedule(), parts = [];
    for (var i = 0; i < sch.length; i++) { parts.push(String(sch[i][1])); }
    el.textContent = 'Packs: ' + parts.join(' · ');
  }

    var occupancy = portrait ? 0.88 : 0.94;
    var visW = Math.max(100, vw - barW);

  window.selftest_DESKLAYOUT = function() {
    var lines = [];

    function chk(cond, msg) {

      else { lines.push('OK: ' + msg); }

    var innerW = window.innerWidth;
    var innerH = window.innerHeight;
    var canvas = document.getElementById('c');

    if (!canvas || !overlay) { chk(false, '(canvas or overlay missing)'); }

    // (a) board visibility — project world corners through window camera

    if (!cam) { chk(false, '(no __cam on window)'); }

    // Grid.W and Grid.H are set by grid.js — read them live

    var GH = window.Grid && window.Grid.H || 8;
    var TILE = window.Grid && window.Grid.TILE || 32;

    // Project cell (0,0) and (GW-1,GH-1) corners to screen coords
    function projectCell(gx, gy) {
      var worldX = gx * TILE + (window.Grid.ox || -GW * TILE / 2 + TILE / 2);
      var worldY = -(gy * TILE) + (window.Grid.oy || +GH * TILE / 2 - TILE / 2);

      vec.project(cam);
      return {
        x: (vec.x + 1) / 2 * innerW,
        y: (-vec.y + 1) / 2 * innerH
      };
    }

    var c00 = projectCell(0, 0);
    var cLast = projectCell(GW - 1, GH - 1);

    // Board bbox in screen coords
    var boardTop = Math.min(c00.y, cLast.y);
    var boardBottom = Math.max(c00.y, cLast.y);
    var boardLeft = Math.min(c00.x, cLast.x);
    var boardRight = Math.max(c00.x, cLast.x);

      chk(barRect.width < innerW * 0.5, '(sd.width)');
      chk(barRect.right >= innerW - 2, '(sd.rightDock)');

      chk(boardTop >= 4, '(a.top) ' + boardTop.toFixed(1) + ' >= 4');
      chk(boardLeft >= 4, '(a.left) ' + boardLeft.toFixed(1) + ' >= 4');
      chk(boardRight <= innerW - 4, '(a.right) ' + boardRight.toFixed(1) + ' <= ' + (innerW - 4));

      chk(barRect.width <= 860, '(b.barWidth) ' + barRect.width.toFixed(1) + ' <= 860');
      var centerX = barRect.left + barRect.width / 2;
      chk(Math.abs(centerX - innerW / 2) <= 2, '(b.center) |' + centerX.toFixed(1) + ' - ' + (innerW/2).toFixed(1) + '| <= 2');

    var seen = {};
    for (var i = 0; i < Path.WAYPOINTS.length; i++) {
      var wp = Path.WAYPOINTS[i];
      chk(wp[0] >= 0 && wp[0] < Grid.W, 'wp[' + i + '] x in bounds (' + wp[0] + ')');
      chk(wp[1] >= 0 && wp[1] < Grid.H, 'wp[' + i + '] y in bounds (' + wp[1] + ')');
      var key = wp[0] + ',' + wp[1];
      if (seen[key]) { chk(false, 'dup waypoint ' + key); ok = false; }
      seen[key] = true;
    }

    // (c) cellAt and indexAt round-trip
    for (var i = 0; i < Path.WAYPOINTS.length; i++) {
      var cell = Path.cellAt(i);
      chk(cell !== null, 'cellAt(' + i + ') not null');
      if (cell) {
        chk(cell[0] === Path.WAYPOINTS[i][0], 'cellAt(' + i + ').x matches');
        chk(cell[1] === Path.WAYPOINTS[i][1], 'cellAt(' + i + ').y matches');
        var idx = Path.indexAt(cell[0], cell[1]);
        chk(idx === i, 'indexAt(' + cell[0] + ',' + cell[1] + ')==' + i);
      }
    }

    // (d) Grid.init(1): every path cell at(x,y)==1; isBuildable false on path
    var grid = Grid.gridTypes();
    for (var y = 0; y < Grid.H; y++) {
      for (var x = 0; x < Grid.W; x++) {
        if (Path.isPath(x, y)) {
          chk(grid[y * Grid.W + x] === 1, 'path cell (' + x + ',' + y + ') type==1');
          chk(Grid.isBuildable(x, y) === false, 'isBuildable(' + x + ',' + y + ')===false on path');
        }
      }
    }

    // (e) at least one floor(0) and one blocked(2) among non-path cells
    var floorCount = 0, pathCount = 0, blockedCount = 0;
    for (var i = 0; i < grid.length; i++) {
      if (!Path.isPath(i % Grid.W, Math.floor(i / Grid.W))) {
        if (grid[i] === 0) floorCount++;
        else if (grid[i] === 2) blockedCount++;
      } else {
        pathCount++;

    chk(pathCount === 24, 'pathCount===24 got ' + pathCount);
    chk(blockedCount === 0, 'blockedCount===0 got ' + blockedCount);

    Grid.init(1);
    var g2 = Grid.gridTypes();
    for (var i = 0; i < g1.length; i++) {

  // selftest dispatch table
  window.checkSelfTest = function() {
    var params = new URLSearchParams(window.location.search);
    var st = params.get('selftest') || '';
    if (!st) return false;

    // regex match: M1, M20a, etc.
    var re = /^M\d+[a-z]?$/;
    if (re.test(st)) {
      var fnName = 'selftest_' + st;
      var fn = window[fnName];
      if (typeof fn === 'function') {
        return fn();
      } else {
        overlay.textContent += '\nFAIL: no handler for selftest=' + st;
        return false;
      }
    }

    // exact match: WPREV, MUTE, etc.
    if (st === 'WPREV' || st === 'MUTE') {
      var fnName = 'selftest_' + st;
      var fn = window[fnName];
      if (typeof fn === 'function') return fn();
      overlay.textContent += '\nFAIL: no handler for selftest=' + st;
      return false;
    }

    // plain: loop M1..M20a
    if (st === 'plain') {
      var results = [];
      var anyCalled = false;
      var allOk = true;
      for (var n = 1; n <= 20; n++) {
        var key = 'selftest_M' + n;
        if (typeof window[key] === 'function') {
          var ok = window[key]();
          results.push('M' + n + '=' + (ok ? 'P' : 'F'));
          if (!ok) allOk = false;
          anyCalled = true;
        }
      }
      var letters = ['a','b','c','d','e','f','g'];
      for (var n2 = 1; n2 <= 20; n2++) {
        for (var li = 0; li < letters.length; li++) {
          var key2 = 'selftest_M' + n2 + letters[li];
          if (typeof window[key2] === 'function') {
            var ok2 = window[key2]();
            results.push('M' + n2 + letters[li] + '=' + (ok2 ? 'P' : 'F'));
            if (!ok2) allOk = false;
            anyCalled = true;
          }
        }
      }
      if (!anyCalled) {
        overlay.textContent += '\nSELFTEST plain FAIL (no handlers found)';
        return false;
      }
      overlay.textContent += '\nSELFTEST ' + results.join('+') + (allOk ? ' PASS' : ' FAIL');
      return allOk;
    }

    // unknown selftest value — try as-is
    var fnName3 = 'selftest_' + st;
    var fn3 = window[fnName3];
    if (typeof fn3 === 'function') {
      return fn3();
    }
    overlay.textContent += '\nFAIL: no handler for selftest=' + st;
    return false;
  };

  // selftest_TERRAIN — E1 lock + buildable count + cdMax + specialAt (-1,-1)
  window.selftest_TERRAIN = function() {
    var ok = true;
    var lines = [];
    function log(msg) { overlay.textContent += '\n' + msg; lines.push(msg); }
    function chk(cond, msg) { if (!assert(cond, msg)) { ok = false; lines.push('FAIL: ' + msg); } else log('OK: ' + msg); return cond; }

    // (a) for each mission 0..3: zero specials within Manhattan 2 of entry cells
    var e0, e1;
    for (var m = 0; m < 4; m++) {
      Missions.load(m);
      Grid.init(1);
      e0 = Path.cellAt(0); e1 = Path.cellAt(1);
      if (!e0 || !e1) { lines.push('FAIL: M'+m+' missing entry'); ok = false; continue; }
      var violations = 0;
      for (var y2 = 0; y2 < Grid.H; y2++) {
        for (var x2 = 0; x2 < Grid.W; x2++) {
          if (!Grid.isBuildable(x2, y2)) continue;
          var sp = Grid.specialAt(x2, y2);
          if (!sp) continue;
          var d0 = Math.abs(x2 - e0[0]) + Math.abs(y2 - e0[1]);
          var d1 = Math.abs(x2 - e1[0]) + Math.abs(y2 - e1[1]);
          if (d0 <= 2 || d1 <= 2) violations++;
        }
      }
      chk(violations === 0, '(a.'+m+') M'+m+' specials near entry: '+violations);
    }

    // (b) M0: exactly 120 buildable cells, zero cells report type 2
    Missions.load(0); Grid.init(1);
    var buildCount = 0, type2Count = 0;
    for (var y3 = 0; y3 < Grid.H; y3++) {
      for (var x3 = 0; x3 < Grid.W; x3++) {
        if (Grid.isBuildable(x3, y3)) buildCount++;
        var g = Grid.gridTypes();
        if (g[y3 * Grid.W + x3] === 2) type2Count++;
      }
    }
    chk(buildCount === 120, '(b.buildable) got '+buildCount);
    chk(type2Count === 0, '(b.type2) got '+type2Count);

    // (c) find patch/inflamed/null cells; place towers; assert cdMax
    Missions.load(0); Grid.init(1); Towers.reset(); Economy.reset(999); // 3 towers @50 needs > START(100)
    var patchCell = null, inflamedCell = null, nullCell = null;
    for (var y4 = 0; y4 < Grid.H && (!patchCell || !inflamedCell || !nullCell); y4++) {
      for (var x4 = 0; x4 < Grid.W && (!patchCell || !inflamedCell || !nullCell); x4++) {
        var sp2 = Grid.specialAt(x4, y4);
        if (sp2 === 'patch' && !patchCell) patchCell = [x4, y4];
        else if (sp2 === 'inflamed' && !inflamedCell) inflamedCell = [x4, y4];
        else if (!sp2 && Grid.isBuildable(x4, y4) && !nullCell) nullCell = [x4, y4];
      }
    }
    var idP = Towers.place(patchCell[0], patchCell[1]);
    chk(idP > 0, '(c.1) place on patch ok');
    chk(Towers.cdMaxOf(idP) === 15, '(c.2) patch cdMax==15 got '+Towers.cdMaxOf(idP));

    var idI = Towers.place(inflamedCell[0], inflamedCell[1]);
    chk(idI > 0, '(c.3) place on inflamed ok');
    chk(Towers.cdMaxOf(idI) === 30, '(c.4) inflamed cdMax==30 got '+Towers.cdMaxOf(idI));

    var idN = Towers.place(nullCell[0], nullCell[1]);
    chk(idN > 0, '(c.5) place on null ok');
    chk(Towers.cdMaxOf(idN) === 20, '(c.6) null cdMax==20 got '+Towers.cdMaxOf(idN));

    // (d) specialAt(-1,-1) === null; specialAt on path cell === null
    chk(Grid.specialAt(-1, -1) === null, '(d.1) specialAt(-1,-1)==null');

      chk(Grid.specialAt(pathCell[0], pathCell[1]) === null, '(d.2) specialAt on entry cell==null');
    }

    overlay.textContent = lines.join('\n') + '\n' + (ok ? 'SELFTEST TERRAIN PASS' : 'SELFTEST TERRAIN FAIL');
    return ok;
  };

  // L2c: visibility pause — gate test
  window.selftest_L2c = function() {
    var chk = function(ok, msg) { if (!ok) throw new Error('L2c FAIL: ' + msg); };
    try {
      Missions.load(0);
      Game.reset();
      Game.start();

      // warm up: advance enough ticks that Waves.tickCount() is non-zero
      for (var i = 0; i < 60; i++) { Waves.tick(); }
      var t0 = Waves.tickCount();
      chk(t0 > 0, 'L2c.1 warm tick>0 got ' + t0);

      // SimPause.step() — divider=2 means every 2 steps calls gameFrameSim which calls Game.tick()
      // but Waves.tickCount is independent of Game.tick; it's its own counter.
      // We need to verify step advances the sim frame and that pause freezes it.
      var tickBefore = Waves.tickCount();
      for (var s = 0; s < 4; s++) { SimPause.step(); }
      chk(Waves.tickCount() >= tickBefore, 'L2c.1a steps advance tick');

      // (b) pre-pause real pointerdown (would have consumed old oneshot)
      document.dispatchEvent(new PointerEvent('pointerdown', { bubbles:true, cancelable:true }));
      chk(!SimPause.awaitingResume(), 'L2c.pre not awaiting before pause');

      // pause: freeze sim path
      SimPause.pause();
      var t1 = Waves.tickCount();
      for (var p = 0; p < 20; p++) { SimPause.step(); }
      chk(Waves.tickCount() === t1, 'L2c.2 paused frozen: tick=' + Waves.tickCount() + ' expected=' + t1);

      // awaiting resume path: set state and show banner
      __simPaused = true;
      __awaitingResume = true;
      SimPause._showBanner();
      var bannerShown = __banner && getComputedStyle(__banner).display !== 'none';
      chk(bannerShown, 'L2c.3 banner visible');
      chk(SimPause.awaitingResume(), 'L2c.3 awaitingResume=true');

      // more steps while awaiting: still frozen (simPaused blocks)
      var tickAwait = Waves.tickCount();
      for (var a = 0; a < 10; a++) { SimPause.step(); }
      chk(Waves.tickCount() === tickAwait, 'L2c.3a awaiting steps frozen: got=' + Waves.tickCount());

      // fire real pointerdown on document (persistent listener) — resume via event
      var __resumeFired = false;
      var _origResume = SimPause.resume;
      SimPause.resume = function() { __resumeFired = true; _origResume.call(SimPause); };
      var evt = new PointerEvent('pointerdown', { bubbles: true, cancelable: true });
      document.dispatchEvent(evt);
      chk(__resumeFired, 'L2c.3b real pointerdown fired resume');
      SimPause.resume = _origResume;

      // resume
      SimPause.resume();
      var bannerHidden = __banner && __banner.style.display === 'none';
      chk(bannerHidden, 'L2c.4 banner hidden after resume');
      chk(!SimPause.awaitingResume(), 'L2c.4 awaitingResume=false');

      // steps now advance again
      var tickAfter = Waves.tickCount();
      for (var r = 0; r < 10; r++) { SimPause.step(); }
      chk(Waves.tickCount() > tickAfter, 'L2c.4b post-resume ticks advance: got=' + Waves.tickCount());

      // divider still correct
      chk(window.SIM_TICK_MS === 1000 / 30, 'L2c.5 tickMs===1000/30');

      overlay.textContent += '\nSELFTEST L2c PASS';
      return true;
    } catch (e) {
      throw new Error('selftest_L2c: ' + e.message);
    }
  };

      chk(barRect.height <= window.innerHeight + 1, '(sd.clamp) rail clamped to viewport');
      chk(barRect.height <= window.innerHeight + 1, '(b1s) rail clamped to viewport');
      // bar width < innerWidth * 0.5 (side-docked)
      chk(barRect.width < W * 0.5, '(b2) bar.width < W*0.5 got ' + barRect.width.toFixed(0) + ' vs ' + (W*0.5).toFixed(0));

      // board clear of panel: cellFromClient center of rightmost path cell
      try {
        var p = Game.clientCenterOfCell(15, 4);
        chk(p && isFinite(p.clientX), '(b3) clientCenterOfCell(15,4) returned ' + JSON.stringify(p));
        if (p) chk(p.clientX < barRect.left, '(b4) cell center X=' + p.clientX.toFixed(0) + ' < bar left=' + barRect.left.toFixed(0));
      } catch(e) { chk(false, '(b3/b4) clientCenterOfCell: ' + e.message); }

      // round-trip: cellFromClient(center) -> same cell
      try {
        var p2 = Game.clientCenterOfCell(15, 4);
        if (p2) {
          var c = Game.cellFromClient(p2.clientX, p2.clientY);
          chk(c && c.x === 15 && c.y === 4, '(b5) round-trip cell=' + JSON.stringify(c));
        } else { chk(false, '(b5) clientCenterOfCell returned null'); }
      } catch(e) { chk(false, '(b5) cellFromClient: ' + e.message); }

      // cell size beats portrait floor (>30px)
      try {
        var fr = Game.frustum();
        var camSizeX = fr.camSizeX || 1;
        var cellPx = (W / (2 * camSizeX)) * Grid.TILE;
        chk(cellPx > 30, '(b6) cellPx=' + cellPx.toFixed(1) + ' > 30');
      } catch(e) { chk(false, '(b6) cell size: ' + e.message); }

      // rotate hint hidden
      try {
        var disp = getComputedStyle(rotateHintEl).display;
        chk(disp === 'none', '(b7) rotate-hint display=none got ' + disp);
      } catch(e) { chk(false, '(b7) rotate-hint: ' + e.message); }

      // SEQ-323 — icons.noScroll / icons.img / icons.packsHidden
      try {
        var barEl = document.getElementById('bottom-bar');
        if (barEl) barEl.scrollTop = 0;
        var types = ['basic','slow','antibody','tcell','fever','nk','cytokine'];
        for (var i = 0; i < types.length; i++) {
          var btn = document.getElementById('btn-type-' + types[i]);
          if (!btn) { chk(false, '(ns.missing) no #btn-type-' + types[i]); continue; }
          var r = btn.getBoundingClientRect();
          chk(r.bottom <= window.innerHeight + 1 && r.top >= 0,
              '(icons.noScroll.' + types[i] + ') rect.bottom=' + r.bottom.toFixed(0) + ' <= H+' + (window.innerHeight+1).toFixed(0) + ' top=' + r.top.toFixed(0) + '>=0');
        }
      } catch(e) { chk(false, '(icons.noScroll): ' + e.message); }

      try {
        var types2 = ['basic','slow','antibody','tcell','fever','nk','cytokine'];
        for (var j = 0; j < types2.length; j++) {
          var btn2 = document.getElementById('btn-type-' + types2[j]);
          if (!btn2) { chk(false, '(img.missing) no #btn-type-' + types2[j]); continue; }
          var imgs = btn2.getElementsByTagName('img');
          var found = false;
          for (var k = 0; k < imgs.length; k++) {
            if (imgs[k].src.indexOf('icon_' + types2[j]) !== -1) { found = true; break; }
          }
          chk(found, '(icons.img.' + types2[j] + ') img src contains icon_' + types2[j]);
        }
      } catch(e) { chk(false, '(icons.img): ' + e.message); }

      try {
        var packsEl = document.getElementById('hud-packs');
        if (packsEl) {
          var pDisp = getComputedStyle(packsEl).display;
          chk(pDisp === 'none', '(icons.packsHidden) #hud-packs display=' + pDisp);
        } else { chk(false, '(icons.packsHidden) #hud-packs element not found'); }
      } catch(e) { chk(false, '(icons.packsHidden): ' + e.message); }
    }

    // (c) Portrait-phone leg (innerHeight > innerWidth && innerWidth <= 500)
    if (H > W && W <= 500) {
      log('PORTRAIT-PHONE W=' + W + ' H=' + H);
      try {
        var disp = getComputedStyle(rotateHintEl).display;
        chk(disp === 'block', '(c1) rotate-hint display=block got ' + disp);
      } catch(e) { chk(false, '(c1) rotate-hint: ' + e.message); }

      // hint does not cover board: hint rect bottom < canvas board top region
      try {
        var hintRect = rotateHintEl.getBoundingClientRect();
        var cellTop = Game.clientCenterOfCell(8, 0);
        chk(hintRect.bottom < (cellTop ? cellTop.clientY : Infinity), '(c2) hintBottom=' + hintRect.bottom.toFixed(0) + ' < boardTop=' + (cellTop ? cellTop.clientY.toFixed(0) : '?'));
      } catch(e) { chk(false, '(c2) hint/board: ' + e.message); }
    }

    // (d) Desktop legs (innerWidth > 500 && innerHeight > 460)
    if (W > 500 && H > 460) {
      log('DESKTOP W=' + W + ' H=' + H);
      try {
        var cxVal2 = Game.frustum().cx;
        chk(cxVal2 === 0, '(d1) frustum.cx===0 got ' + cxVal2);
      } catch(e) { chk(false, '(d1) frustum: ' + e.message); }

      try {
        var disp = getComputedStyle(rotateHintEl).display;
        chk(disp === 'none', '(d2) rotate-hint display=none got ' + disp);
      } catch(e) { chk(false, '(d2) rotate-hint: ' + e.message); }
    }

    overlay.textContent = lines.join('\n') + '\n' + (ok ? 'SELFTEST LANDPHONE PASS' : 'SELFTEST LANDPHONE FAIL');
    return ok;
  };



  // SW register (http/https only, not file://)
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
    var __swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (__swReloaded) return; __swReloaded = true;
      location.reload();
    });
  }

  window.selftest_FLOW = function() {
    var out = [];
    function chk(c, m) { if (!c) out.push('FAIL ' + m); }

    Missions.load(0);
    Ambient.init();

    chk(typeof window.Ambient === 'object', '(a) Ambient object');
    chk(typeof Ambient.frame === 'function', '(a.2) frame fn');
    chk(Ambient.FLOW_SPEED === 0.12, '(a.3) speed 0.12 got ' + Ambient.FLOW_SPEED);
    chk(Ambient.SAMPLES_PER_SEG === 8, '(a.4) samples 8 got ' + Ambient.SAMPLES_PER_SEG);
    chk(Ambient.HALF_WIDTH === 0.34, '(a.5) halfwidth 0.34 got ' + Ambient.HALF_WIDTH);

    var rib = Ambient.ribbon();
    chk(rib !== null, '(b) ribbon exists');
    chk(rib.name === 'flowRibbon', '(b.2) name got ' + (rib && rib.name));
    chk(rib.parent === Grid.scene, '(b.3) attached to Grid.scene');
    var K = Path.WAYPOINTS.length;
    chk(K === 24, '(b.4) M0 waypoints 24 got ' + K);
    var want = 2 * ((24 - 1) * 8 + 1);
    var got = rib.geometry.getAttribute('position').count;
    chk(got === want, '(b.5) vertex count ' + want + ' got ' + got);
    chk(rib.renderOrder === 4, '(b.6) renderOrder 4 got ' + rib.renderOrder);
    chk(Math.abs(rib.position.z - 0.02) < 1e-9, '(b.7) z 0.02 got ' + rib.position.z);

    var pos = rib.geometry.getAttribute('position');
    var ox = -Grid.W * Grid.TILE / 2 + Grid.TILE / 2;
    var oy = +Grid.H * Grid.TILE / 2 - Grid.TILE / 2;
    var worst = 0;
    for (var w = 0; w < K; w++) {
      var c = Path.cellAt(w);
      var wx = c[0] * Grid.TILE + ox, wy = -(c[1] * Grid.TILE) + oy;
      var best = 1e9;
      for (var i = 0; i < pos.count; i += 2) {
        var mx = (pos.getX(i) + pos.getX(i + 1)) / 2;
        var my = (pos.getY(i) + pos.getY(i + 1)) / 2;
        var d = Math.sqrt((mx - wx) * (mx - wx) + (my - wy) * (my - wy)) / Grid.TILE;
        if (d < best) best = d;
      }
      if (best > worst) worst = best;
    }
    chk(worst <= 0.28, '(c) worst waypoint-to-ribbon ' + worst.toFixed(3) + ' > 0.28');

    Ambient.frame(0);
    var o0 = rib.material.map.offset.x;
    Ambient.frame(1000);
    var o1 = rib.material.map.offset.x;
    var delta = ((o0 - o1) % 1 + 1) % 1;
    chk(Math.abs(delta - 0.12) < 1e-6, '(d) 1s scroll 0.12 got ' + delta.toFixed(6));

    Missions.load(0); Game.reset(); Game.start();
    var lives0 = Lives.get(), gold0 = Economy.getGold(), n0 = Enemies.all().length;
    for (var f = 0; f < 60; f++) { Ambient.frame(f * 16.7); }
    chk(Lives.get() === lives0, '(e) lives moved ' + lives0 + '->' + Lives.get());
    chk(Economy.getGold() === gold0, '(e.2) gold moved ' + gold0 + '->' + Economy.getGold());
    chk(Enemies.all().length === n0, '(e.3) enemies moved ' + n0 + '->' + Enemies.all().length);

    Grid.buildMeshes();
    Ambient.frame(2000);
    var rib2 = Ambient.ribbon();
    chk(rib2 !== null, '(f) ribbon rebuilt after buildMeshes');
    chk(rib2 && rib2.parent === Grid.scene, '(f.2) re-attached to scene');

    Missions.load(2);
    Ambient.frame(3000);
    var rib3 = Ambient.ribbon();
    var K2 = Path.WAYPOINTS.length;
    chk(K2 === 25, '(g) M2 waypoints 25 got ' + K2);
    var want3 = 2 * ((25 - 1) * 8 + 1);
    var got3 = rib3 ? rib3.geometry.getAttribute('position').count : -1;
    chk(got3 === want3, '(g.2) M2 vertex count ' + want3 + ' got ' + got3);

    Missions.load(0);
    var el = document.getElementById('overlay');
    el.textContent = out.length ? ('SELFTEST FLOW ' + out.join(' | ')) : 'SELFTEST FLOW PASS';
    return out.length === 0;
  };

  window.selftest_FIELD = function() {
    var out = [];
    function chk(c, m) { if (!c) out.push('FAIL ' + m); }
    function overlay() {
      var l = Grid.scene.children.filter(function(c){ return c.name === 'fieldOverlay'; });
      return l.length === 1 ? l[0] : null;
    }
    function alphaSum(m) {
      var d = m.material.map.image.data, s = 0;
      for (var i = 3; i < d.length; i += 4) s += d[i];
      return s;
    }

    Missions.load(0); Game.reset(); Ambient.init();

    // (a) overlay exists exactly once, correct placement + texture size
    var m = overlay();
    chk(m !== null, '(a) exactly one fieldOverlay');
    if (!m) { document.getElementById('overlay').textContent = 'SELFTEST FIELD ' + out.join(' | '); return false; }
    chk(Math.abs(m.position.z - 0.03) < 1e-9, '(a.2) z 0.03 got ' + m.position.z);
    chk(m.renderOrder === 5, '(a.3) renderOrder 5 got ' + m.renderOrder);
    chk(m.material.map.image.width === 32, '(a.4) tex w 32 got ' + m.material.map.image.width);
    chk(m.material.map.image.height === 18, '(a.5) tex h 18 got ' + m.material.map.image.height);
    chk(m.material.depthWrite === false, '(a.6) depthWrite false');

    // (b) a FRESH organ is clean — zero field alpha
    Ambient.frame(0);
    chk(alphaSum(m) === 0, '(b) fresh board alpha must be 0, got ' + alphaSum(m));

    // (c) TOWERS radiate immune hold
    Towers.place(4, 5);
    Ambient.frame(60); Ambient.frame(120);
    var afterTower = alphaSum(m);
    chk(afterTower > 0, '(c) tower must write hold, got ' + afterTower);

    // (d) PATHOGENS stain the tissue
    Enemies.spawn('basic', 0, 0);
    Ambient.frame(180); Ambient.frame(240);
    var afterEnemy = alphaSum(m);
    chk(afterEnemy > afterTower, '(d) enemy must add infection, ' + afterTower + ' -> ' + afterEnemy);

    // (e) NECROSIS from lives lost, and it is PERMANENT (never decays)
    Lives.lose(2);
    Ambient.frame(300); Ambient.frame(360);
    var withNec = alphaSum(m);
    chk(withNec > afterEnemy, '(e) lives lost must necrose, ' + afterEnemy + ' -> ' + withNec);
    Enemies.reset();
    for (var t = 0; t < 40; t++) Ambient.frame(400 + t * 100);
    var late = alphaSum(m);
    chk(late > 0, '(e.2) necrosis must persist after infection decays, got ' + late);

    // (f) SIM DETERMINISM — frame() must never move the sim
    Missions.load(0); Game.reset(); Game.start(); Ambient.init();
    var lv = Lives.get(), gd = Economy.getGold(), en = Enemies.all().length;
    for (var f = 0; f < 60; f++) Ambient.frame(f * 16);
    chk(Lives.get() === lv, '(f) lives moved ' + lv + '->' + Lives.get());
    chk(Economy.getGold() === gd, '(f.2) gold moved ' + gd + '->' + Economy.getGold());
    chk(Enemies.all().length === en, '(f.3) enemies moved ' + en + '->' + Enemies.all().length);

    // (g) THE WIPE TRAP — Grid.buildMeshes() removes it; next frame must rebuild
    Grid.buildMeshes();
    Ambient.frame(9000);
    var m2 = overlay();
    chk(m2 !== null, '(g) overlay rebuilt after buildMeshes');
    chk(m2 && m2.parent === Grid.scene, '(g.2) re-attached to scene');

    Missions.load(0); Game.reset();
    var el = document.getElementById('overlay');
    el.textContent = out.length ? ('SELFTEST FIELD ' + out.join(' | ')) : 'SELFTEST FIELD PASS';
    return out.length === 0;
  };

  window.Fullscreen = (function(){
    var el = document.documentElement;
    var supported = !!(el.requestFullscreen || el.webkitRequestFullscreen);
    // Safari on iPHONE implements no Fullscreen API at all (iPad does). There the
    // route to a chromeless game is Add to Home Screen, which this PWA already
    // supports via display:standalone + apple-mobile-web-app-capable.
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = !!(window.navigator.standalone) ||
                     !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    function active(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function toggle(){
      if (!supported) {
        if (isIOS && !standalone && typeof showPlaceToast === 'function') {
          showPlaceToast('Tap Share, then "Add to Home Screen" for fullscreen');
        }
        return;
      }
      try {
        if (active()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
        else { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
      } catch (e) {}
    }
    function sync(){
      var b = document.getElementById('btn-fullscreen');
      if (!b) return;
      // Show it where it can DO something, or on iOS where it can EXPLAIN itself.
      // Hide once already standalone — the game is fullscreen there already.
      var show = supported || (isIOS && !standalone);
      b.style.display = show ? 'block' : 'none';
      b.innerHTML = active() ? '&#9974; Exit' : '&#9974; Fullscreen';
    }
    return { supported: supported, isIOS: isIOS, standalone: standalone,
             active: active, toggle: toggle, sync: sync };
  })();
  (function(){
    var b = document.getElementById('btn-fullscreen');
    if (b) b.addEventListener('click', function(){ Fullscreen.toggle(); });
    document.addEventListener('fullscreenchange', Fullscreen.sync);
    document.addEventListener('webkitfullscreenchange', Fullscreen.sync);
    Fullscreen.sync();
  })();

  window.selftest_FULLSCREEN = function() {
    var out = [];
    function chk(c, m) { if (!c) out.push('FAIL ' + m); }
    var b = document.getElementById('btn-fullscreen');
    chk(b !== null, '(a) #btn-fullscreen exists');
    chk(typeof window.Fullscreen === 'object', '(b) Fullscreen module');
    chk(typeof Fullscreen.toggle === 'function', '(b.2) toggle fn');
    chk(typeof Fullscreen.supported === 'boolean', '(b.3) supported flag');
    chk(typeof Fullscreen.isIOS === 'boolean', '(b.4) isIOS flag');
    chk(typeof Fullscreen.standalone === 'boolean', '(b.5) standalone flag');
    if (b) {
      Fullscreen.sync();
      var disp = b.style.display;
      // shown where it can act (Fullscreen API) OR where it can explain itself (iOS
      // Safari, not yet installed to the home screen); hidden otherwise
      var shouldShow = Fullscreen.supported || (Fullscreen.isIOS && !Fullscreen.standalone);
      chk(shouldShow ? disp !== 'none' : disp === 'none',
          '(c) visibility: supported=' + Fullscreen.supported + ' iOS=' + Fullscreen.isIOS +
          ' standalone=' + Fullscreen.standalone + ' display=' + disp);
      if (Fullscreen.supported) {
        chk(b.getBoundingClientRect().height >= 30, '(c.2) height got ' + b.getBoundingClientRect().height);
        chk(/Fullscreen|Exit/.test(b.textContent), '(c.3) label got ' + b.textContent.trim());
      }
    }
    chk(Fullscreen.active() === false, '(d) not fullscreen at rest');
    var el2 = document.getElementById('overlay');
    el2.textContent = out.length ? ('SELFTEST FULLSCREEN ' + out.join(' | ')) : 'SELFTEST FULLSCREEN PASS';
    return out.length === 0;
  };

  // run checkSelfTest at end of boot — MUST stay the last statement so that every
  // window.selftest_* handler is defined before the dispatcher looks it up
  window.checkSelfTest();

})();
</script>
